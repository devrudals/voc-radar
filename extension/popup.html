<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>VOCRadar Review Intelligence</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #161617;
      --surface-elevated: #1c1c1e;
      --border: rgba(255, 255, 255, 0.12);
      --border-hover: rgba(255, 255, 255, 0.24);
      --blue: #0071e3;
      --blue-hover: #0077ed;
      --green: #34c759;
      --red: #ff453a;
      --text: #f5f5f7;
      --text-secondary: #86868b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 380px;
      margin: 0;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", "SF Pro Text", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blue);
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #fff;
    }
    .badge {
      font-size: 11px;
      font-weight: 500;
      background: rgba(52, 199, 89, 0.12);
      color: var(--green);
      border: 1px solid rgba(52, 199, 89, 0.25);
      padding: 2px 8px;
      border-radius: 980px;
    }
    .btn-scrape {
      width: 100%;
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 11px 16px;
      border-radius: 980px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.15s ease;
      margin-bottom: 12px;
    }
    .btn-scrape:hover {
      background: var(--blue-hover);
    }
    .status-msg {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      text-align: center;
      line-height: 1.4;
    }
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      display: none;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }
    .stat-row strong {
      color: var(--text);
      font-weight: 600;
    }
    .flaws-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      margin-top: 10px;
      margin-bottom: 6px;
    }
    .flaw-mini-item {
      font-size: 11px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      padding: 7px 10px;
      border-radius: 8px;
      margin-top: 5px;
      color: #ff9f0a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn-action {
      flex: 1;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px;
      border-radius: 980px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-action:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--border-hover);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      </div>
      <span class="title">VOCRadar Mini</span>
    </div>
    <span class="badge">0 Server Cost</span>
  </div>

  <button id="btn-scrape-now" class="btn-scrape">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    <span>현재 페이지 리뷰 즉시 추출 & 분석</span>
  </button>
  <div id="status" class="status-msg">아마존/쿠팡 상품 페이지에서 위 버튼을 클릭하세요.</div>

  <div id="results" class="summary-card">
    <div class="stat-row">
      <span>수집된 리뷰 수</span>
      <strong id="stat-count">0개</strong>
    </div>
    <div class="stat-row">
      <span>시장 진입 기회 지수</span>
      <strong id="stat-opp" style="color: var(--green);">0 / 100</strong>
    </div>
    <div class="flaws-label">핵심 빈출 결함 키워드</div>
    <div id="mini-flaws"></div>
  </div>

  <div class="btn-row">
    <button id="btn-copy-reviews" class="btn-action" style="display: none;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      <span>리뷰 텍스트 복사</span>
    </button>
    <a href="https://devrudals.github.io/voc-radar/" target="_blank" class="btn-action">
      <span>전체 대시보드 열기</span>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
