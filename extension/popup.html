<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>VOCRadar Mini</title>
  <style>
    body {
      width: 380px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090c10;
      color: #f0f3f6;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }
    .title {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
    }
    .badge {
      font-size: 10px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      padding: 2px 6px;
      border-radius: 99px;
    }
    .btn-scrape {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .status-msg {
      font-size: 12px;
      color: #9aa5b8;
      margin-bottom: 10px;
      text-align: center;
    }
    .summary-card {
      background: #0e131d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      display: none;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .flaw-mini-item {
      font-size: 11px;
      background: #141c2b;
      padding: 6px 8px;
      border-radius: 4px;
      margin-top: 4px;
      color: #fda4af;
    }
    .btn-full-app {
      width: 100%;
      background: #121824;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #93c5fd;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      display: block;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">📡 VOCRadar Mini</span>
    <span class="badge">0 Token</span>
  </div>

  <button id="btn-scrape-now" class="btn-scrape">⚡ 현재 페이지 리뷰 즉시 추출 & 분석</button>
  <div id="status" class="status-msg">아마존/쿠팡 상품 페이지에서 버튼을 누르세요.</div>

  <div id="results" class="summary-card">
    <div class="stat-row">
      <span>수집된 리뷰 수:</span>
      <strong id="stat-count">0개</strong>
    </div>
    <div class="stat-row">
      <span>시장 기회 지수:</span>
      <strong id="stat-opp" style="color: #10b981;">0 / 100</strong>
    </div>
    <div style="font-size: 11px; font-weight: 700; margin-top: 8px; color: #f0f3f6;">치명적 결함 TOP:</div>
    <div id="mini-flaws"></div>
  </div>

  <a href="http://localhost:3000" target="_blank" class="btn-full-app">🔗 VOCRadar 웹 대시보드 전체화면 열기</a>

  <script src="popup.js"></script>
</body>
</html>
